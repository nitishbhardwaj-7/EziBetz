name: Build Android App

# Builds the artifacts/mobile Expo app into a debug APK (installable
# directly for testing/sideloading) and a release AAB (the format Google
# Play requires). Both are built with expo prebuild + a plain Gradle build —
# no EAS/Expo account or secrets required.
#
# NOTE on signing: the release AAB is signed with Expo's default debug
# keystore (the same one prebuild always generates), which is enough to
# produce an installable, verifiable build but is NOT acceptable for a real
# Play Store submission. Before publishing for real, replace it with your
# own upload keystore — see:
# https://docs.expo.dev/app-signing/local-credentials/

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate native Android project
        working-directory: artifacts/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Make gradlew executable
        working-directory: artifacts/mobile/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: artifacts/mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release AAB
        working-directory: artifacts/mobile/android
        # -x lintVitalRelease: bundleRelease (unlike assembleDebug) runs a
        # fatal-only lint pass by default as part of bundling for Play Store.
        # Skipped here so a lint finding doesn't block producing the AAB —
        # run lint separately/explicitly before an actual Play submission.
        run: ./gradlew bundleRelease --no-daemon --stacktrace -x lintVitalRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ezibetz-debug-apk
          path: artifacts/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: ezibetz-release-aab
          path: artifacts/mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # On a version tag (e.g. `v1.0.0`), also attach both files to a GitHub
      # Release so they're downloadable without opening the Actions tab.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/mobile/android/app/build/outputs/apk/debug/*.apk
            artifacts/mobile/android/app/build/outputs/bundle/release/*.aab
