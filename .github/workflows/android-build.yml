name: Build Android App

# Builds the artifacts/mobile Expo app three ways, with expo prebuild +
# a plain Gradle build (no EAS/Expo account or secrets required):
#
#   - debug APK: installable, but loads JS live from a Metro dev server
#     (localhost:8081) at launch instead of bundling it in — it's for
#     active development against a running `expo start`, NOT for
#     standalone testing. Install it with nothing else running and you'll
#     get "Unable to load script."
#   - release APK: standalone-installable, JS bundled in, no dev server
#     needed. THIS is the one to sideload for real testing.
#   - release AAB: the format Google Play requires for submission; not
#     directly installable (Play/bundletool splits it per-device).
#
# NOTE on signing: both release builds are signed with Expo's default debug
# keystore (the same one prebuild always generates), which is enough to
# produce an installable, verifiable build but is NOT acceptable for a real
# Play Store submission. Before publishing for real, replace it with your
# own upload keystore — see:
# https://docs.expo.dev/app-signing/local-credentials/

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ubuntu-latest ships ~14GB free by default — not enough for two full
      # Expo/RN Android builds (debug APK + release AAB, each compiling
      # native C++ for multiple ABIs). The previous run died mid-build with
      # "No space left on device". Reclaim space from large preinstalled
      # toolchains this job never touches (leave the Android SDK/NDK alone —
      # the native build needs it).
      - name: Free disk space
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /usr/share/swift "$AGENT_TOOLSDIRECTORY/CodeQL" 2>/dev/null || true
          docker image prune -af 2>/dev/null || true
          echo "After:"; df -h /

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest runners already ship a full Android SDK (cmdline-tools,
      # platform-tools, several build-tools/platforms) under $ANDROID_HOME —
      # android-actions/setup-android@v3 is unmaintained and its default
      # package list includes the legacy standalone "tools" package, which
      # Google removed from the SDK repository years ago, so it now always
      # fails. Just make sure our exact required packages are present on
      # the SDK that's already there.
      - name: Ensure required Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Couldn't find sdkmanager under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate native Android project
        working-directory: artifacts/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Make gradlew executable
        working-directory: artifacts/mobile/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: artifacts/mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # CMake/ninja's intermediate object files (.cxx dirs, one per native
      # module per ABI) are routinely several GB and are pure build cache —
      # nothing here is needed once assembleDebug has produced its APK, and
      # the release build regenerates them fresh anyway.
      - name: Reclaim debug build's native intermediates
        run: |
          df -h /
          find . -type d -name ".cxx" -prune -exec rm -rf {} + 2>/dev/null || true
          df -h /

      - name: Build release APK + AAB
        working-directory: artifacts/mobile/android
        # assembleRelease (standalone-installable APK) and bundleRelease
        # (Play Store AAB) share almost all of the same compile/link work,
        # so building them together here is barely more expensive than
        # bundleRelease alone was.
        # -x lintVitalRelease: bundleRelease (unlike assembleDebug/assembleRelease)
        # runs a fatal-only lint pass by default as part of bundling for Play
        # Store. Skipped here so a lint finding doesn't block producing the
        # AAB — run lint separately/explicitly before an actual submission.
        run: ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace -x lintVitalRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ezibetz-debug-apk
          path: artifacts/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ezibetz-release-apk
          path: artifacts/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: ezibetz-release-aab
          path: artifacts/mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # On a version tag (e.g. `v1.0.0`), also attach these files to a
      # GitHub Release so they're downloadable without opening the Actions
      # tab. Debug APK omitted here — it's a dev-loop artifact, not
      # something to hand anyone for testing.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/mobile/android/app/build/outputs/apk/release/*.apk
            artifacts/mobile/android/app/build/outputs/bundle/release/*.aab
